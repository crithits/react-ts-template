version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    groups:
      # Shared standards land together and fast.
      agent-standards:
        patterns: ["@crithits/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "babel-plugin-react-compiler"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "eslint", "typescript", "@testing-library/*", "jsdom", "@babel/*", "@rolldown/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
