name: Update lockfile

# Regenerates pnpm-lock.yaml against GitHub Packages and commits it to the
# current branch. Run it manually (Actions → Update lockfile → Run workflow)
# after creating a repo from the template, or whenever the lockfile is out of
# sync with package.json.

on:
  workflow_dispatch:
    inputs:
      from_scratch:
        description: Delete the lockfile first and re-resolve everything (picks up newest allowed versions)
        type: boolean
        default: false

permissions:
  contents: write
  packages: read
  actions: write # to start CI afterwards (pushes made with GITHUB_TOKEN don't trigger it)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@crithits"

      - name: Remove existing lockfile
        if: inputs.from_scratch
        run: rm -f pnpm-lock.yaml

      - run: pnpm install --lockfile-only --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "Lockfile already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the new commit
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
